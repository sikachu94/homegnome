[project]
name = "homegnome"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Omar Ahmed", email = "osayed12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.110.0",
    "pydantic==2.11.7",
    "supabase==2.31.0",
    "mistralai==2.9.4",
    "python-dotenv==1.0.1",
    "uvicorn==0.29.0",
]

[project.scripts]
homegnome = "homegnome:main"

[tool.vercel]
entrypoint = "api.index:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
